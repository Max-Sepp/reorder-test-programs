name: Conformance

# Build each server with sanitisers and run the shared interface conformance
# tests against it on Linux.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Crow (clang, ASan + UBSan)
            script: scripts/test_crow.sh
          - name: cpp-httplib (clang, ASan + UBSan)
            script: scripts/test_httplib.sh
          - name: Drogon (clang, ASan + UBSan)
            script: scripts/test_drogon.sh
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl

      # GitHub-hosted runners ship a bootstrapped vcpkg at
      # $VCPKG_INSTALLATION_ROOT; the test script picks it up via VCPKG_ROOT.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('cpp/**/vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Build with sanitisers and run conformance tests
        run: |
          export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          ${{ matrix.script }}
